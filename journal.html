<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal — Knotty Things</title>
<meta name="description" content="Process, new work, recognition and travels from the Knotty Things studio.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=2">
<style>
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px}
.tags button{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--line);background:none;padding:10px 16px;border-radius:999px;cursor:pointer}
.tags button[aria-pressed="true"]{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.feed{padding-bottom:140px}
.month{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;border-top:1px solid var(--line);padding-top:30px;margin-top:50px}
.month h2{font-size:var(--t-m);position:sticky;top:110px;align-self:start}
.posts{display:grid;gap:50px}
.post{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:34px;align-items:start}
.post .im{aspect-ratio:4/3;overflow:hidden;position:relative}
.post .im img{width:100%;height:100%;object-fit:cover}
.post .im.typo{display:flex;align-items:flex-end;padding:22px;color:var(--bone)}
.post .im.typo b{font-weight:300;font-size:clamp(30px,3vw,46px);line-height:.95}
.post .meta{display:flex;gap:16px;color:var(--reed);margin-bottom:12px}
.post h3{font-size:clamp(28px,2.6vw,40px);margin-bottom:14px}
.post p{color:var(--ink-2);max-width:54ch}
.src{margin-top:16px;display:inline-block}
@media (max-width:860px){.month{grid-template-columns:1fr}.month h2{position:static}.post{grid-template-columns:1fr}}
</style>
</head>
<body data-page="journal" data-header="light">
<header class="phero"><div class="wrap">
  <span class="label">Journal</span>
  <h1>Notes from <em>the studio.</em></h1>
  <p>Process, new work, recognition and travels. Some days are about the doing, not the telling.</p>
  <div class="tags" id="tags" role="group" aria-label="Filter journal"></div>
</div></header>
<main class="wrap feed" id="feed"></main>
<script src="assets/data.js?v=2"></script>
<script src="assets/site.js?v=2"></script>
<script>
const tones = { Process:"#3B342E", "New work":"#7A2E22", Events:"#5A1828", Travels:"#2F3A3F", Galleries:"#55613A", Recognition:"#8A6A2E", Atelier:"#3B342E", Craft:"#9A7E58" };
const tags = ["All", ...new Set(KT.journal.map(j => j.tag))];
let tag = "All";
document.getElementById("tags").innerHTML = tags.map(t => `<button aria-pressed="${t === "All"}" data-t="${t}">${t}</button>`).join("");
document.getElementById("tags").onclick = e => { const b = e.target.closest("button"); if (!b) return; tag = b.dataset.t; document.querySelectorAll("#tags button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long" });
function render() {
  const list = KT.journal.filter(j => tag === "All" || j.tag === tag);
  const byMonth = {};
  list.forEach(j => { const m = new Date(j.d + "T00:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" }); (byMonth[m] ||= []).push(j); });
  document.getElementById("feed").innerHTML = Object.entries(byMonth).map(([m, js]) => `
    <section class="month"><h2>${m}</h2><div class="posts">${js.map(j => `
      <article class="post">
        ${j.img ? `<div class="im"><img src="img/${j.img}.jpg" alt="" loading="lazy"></div>` : `<div class="im typo" style="background:${tones[j.tag] || "#3B342E"}"><b>${j.t.split(":")[0]}</b></div>`}
        <div><div class="meta label"><span>${j.tag}</span><span class="num">${fmt(j.d)}</span></div><h3>${j.t}</h3><p>${j.x}</p>
        <a class="src link" href="https://www.instagram.com/the.knotty.things" target="_blank" rel="noopener">On Instagram <span data-icon="ext"></span></a></div>
      </article>`).join("")}</div></section>`).join("");
}
render();
</script>
</body>
</html>
