<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Knotty Things</title>
<meta name="description" content="Write to Knotty Things: questions, collaborations, press and studio visits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=3">
<style>
.pack{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(30px,6vw,100px)}
.pack form{display:grid;grid-template-columns:1fr 1fr;gap:28px 30px;align-content:start}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-family:var(--sans);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2)}
.f input,.f select,.f textarea{font:inherit;font-size:20px;background:transparent;border:0;border-bottom:1px solid rgba(26,22,19,.3);padding:8px 0;color:var(--ink);border-radius:0;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.pack form .btn{justify-self:start}
.note{grid-column:1/-1;color:var(--reed);min-height:1.5em}
.direct{display:grid;gap:6px;font-size:20px;margin-top:34px}
.direct .label{color:var(--reed);margin-bottom:6px}
@media (max-width:960px){.pack{grid-template-columns:1fr}}
@media (max-width:560px){.pack form{grid-template-columns:1fr}}
</style>
</head>
<body data-page="contact" data-header="light">
<header class="phero"><div class="wrap">
  <span class="label">Contact</span>
  <h1>Write to <em>the studio.</em></h1>
  <p>Questions, collaborations, press or a visit to the atelier. For a new work, the <a href="commission.html" style="border-bottom:1px solid">commission brief</a> helps us start faster.</p>
</div></header>

<section class="sec"><div class="wrap pack">
  <div>
    <div class="direct"><span class="label">Or speak to us</span><a href="mailto:contact@theknottythings.com">contact@theknottythings.com</a><a href="tel:+919717040077">+91 97170 40077</a><a href="tel:+919717844077">+91 97178 44077</a></div>
  </div>
  <form id="f" name="contact" method="POST" data-netlify="true" netlify-honeypot="website" novalidate>
    <input type="hidden" name="form-name" value="contact"><input type="hidden" name="subject" value="New enquiry — Knotty Things website">
    <p hidden><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></p>
    <div class="f"><label for="n">Name</label><input id="n" name="name" required autocomplete="name"></div>
    <div class="f"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email"></div>
    <div class="f"><label for="ph">Phone (optional)</label><input id="ph" name="phone" type="tel" autocomplete="tel"></div>
    <div class="f"><label for="c">City, country (optional)</label><input id="c" name="city"></div>
    <div class="f full"><label for="m">Message</label><textarea id="m" name="message" rows="4" required></textarea></div>
    <button class="btn" type="submit">Send <span class="arr">→</span></button>
    <p class="note" id="note" aria-live="polite"></p>
  </form>
</div></section>

<script src="assets/data.js?v=3"></script>
<script src="assets/site.js?v=3"></script>
<script>
document.getElementById("f").onsubmit = e => {
  e.preventDefault(); const f = e.target, note = document.getElementById("note"), btn = f.querySelector('button[type="submit"]');
  if (!f.n.value.trim() || !f.e.value || !f.e.checkValidity() || !f.m.value.trim()) { note.textContent = "Please add your name, a valid email and a message."; return; }
  if (f.elements.website.value) return; // bots fill the hidden field
  btn.disabled = true; note.textContent = "Sending…";
  KTsend("contact", { name: f.n.value, email: f.e.value, phone: f.ph.value, city: f.c.value, message: f.m.value, subject: f.elements.subject.value })
    .then(() => { f.reset(); note.textContent = "Thank you. Your message has reached the studio; we'll reply personally."; })
    .catch(() => { note.innerHTML = 'Sorry, that didn\'t send. Please try again, or email <a href="mailto:contact@theknottythings.com" style="border-bottom:1px solid">contact@theknottythings.com</a>.'; })
    .finally(() => { btn.disabled = false; });
};
</script>
</body>
</html>
